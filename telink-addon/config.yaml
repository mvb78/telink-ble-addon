name: Telink BLE CLI
version: "1.0.27"
slug: telink_ble_cli
image: "ghcr.io/mvb78/telink-ble-cli"
description: Web UI + Home Assistant bridge for Telink (Smart_qXsx) BLE mesh lamps
url: "https://github.com/mvb78/telink-ble-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
host_dbus: true
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: "mdi:lightbulb-group-outline"
apparmor: false
privileged:
  - NET_ADMIN
  - NET_RAW
usb: true
devices:
  - /dev/bus/usb
ports:
  8099/tcp: 8098
ports_description:
  8099/tcp: Telink web UI (fallback when Ingress is unavailable)
options:
  known_passwords: "0000,1234,123,8888"
  scan_timeout: 45
schema:
  known_passwords: str
  scan_timeout: int
