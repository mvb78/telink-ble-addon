name: Telink BLE CLI
version: "1.0.38"
slug: telink_ble_cli
image: "ghcr.io/mvb78/telink-ble-cli"
description: Web UI + Home Assistant bridge for Telink (Smart_qXsx) BLE mesh lamps
url: "https://github.com/mvb78/telink-ble-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
host_dbus: true
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: "mdi:lightbulb-group-outline"
apparmor: false
full_access: true
ports:
  8099/tcp: 8098
ports_description:
  8099/tcp: Telink web UI (fallback when Ingress is unavailable)
options:
  known_passwords: "8888"
  scan_timeout: 45
  daemon_host: ""
  daemon_port: 8097
schema:
  known_passwords: str
  scan_timeout: int
  daemon_host: str
  daemon_port: int
