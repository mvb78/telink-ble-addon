# Builds and publishes the Telink BLE CLI add-on docker image to ghcr.io.
#
# The add-on's config.yaml (version + `image: ghcr.io/mvb78/telink-ble-cli`)
# is the Supervisor's source of truth: an update.install for vX.Y.Z does a
# `docker pull ghcr.io/mvb78/telink-ble-cli:<version>` — so every new version
# MUST exist on ghcr, otherwise the HA Updates UI errors with
# "[404] manifest unknown". This workflow closes that gap: on every `v*` tag
# (same as the GitHub release) the image is published with the stripped
# version tag.
name: publish-ghcr

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag to publish (e.g. 1.4.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./telink-addon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          labels: io.hass.version=${{ steps.version.outputs.version }}
        env:
          IO_HASS_VERSION: ${{ steps.version.outputs.version }}
